replicaCount: 2

image:
  repository: ai-video/video-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_URL: "postgresql://aivideo:aivideo@postgres:5432/aivideo"
  MINIO_ENDPOINT: "minio:9000"

services:
  video:
    enabled: true
    port: 8000
  user:
    enabled: true
    port: 8001
  search:
    enabled: true
    port: 8002
  analytics:
    enabled: true
    port: 8003
  recommendation:
    enabled: true
    port: 8004

workers:
  transcoder:
    enabled: true
    replicas: 2
  transcriber:
    enabled: true
    replicas: 2
  embedder:
    enabled: true
    replicas: 2

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.ai-video.local
      paths:
        - path: /
          pathType: Prefix

monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
