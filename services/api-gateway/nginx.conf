events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream video_service {
        server video-service:8000;
    }
    upstream user_service {
        server user-service:8000;
    }
    upstream search_service {
        server search-service:8000;
    }
    upstream analytics_service {
        server analytics-service:8000;
    }
    upstream recommendation_service {
        server recommendation-service:8000;
    }

    server {
        listen 80;
        client_max_body_size 500M;

        location /api/videos {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            proxy_pass http://video_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/users {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/search {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://search_service;
            proxy_set_header Host $host;
        }

        location /api/analytics {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://analytics_service;
            proxy_set_header Host $host;
        }

        location /api/recommendations {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://recommendation_service;
            proxy_set_header Host $host;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
